# Airora's code is private (AbhiramUpadrashta/Airora-src). This public repo builds the apps and publishes them.
name: Build & Release Airora
on:
  push: { branches: [main], paths: ["release.txt"] }
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    outputs: { version: "${{ steps.v.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { repository: AbhiramUpadrashta/Airora-src, ssh-key: "${{ secrets.SRC_KEY }}" }
      - id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
  desktop:
    needs: check
    strategy: { fail-fast: false, matrix: { include: [ { os: macos-latest, target: mac }, { os: windows-latest, target: win } ] } }
    runs-on: ${{ matrix.os }}
    env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { repository: AbhiramUpadrashta/Airora-src, ssh-key: "${{ secrets.SRC_KEY }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        run: |
          npm install --no-audit --no-fund
          ./build.sh && rm -rf dist/media && cp -R dist desktop/app
          cd desktop && npm install --no-audit --no-fund
          if [ "${{ matrix.target }}" = mac ]; then
            npm run dist:mac; APP="$(find dist -maxdepth 3 -name 'Airora.app' | head -1)"; codesign --force --deep --sign - "$APP"
            ditto -c -k --sequesterRsrc --keepParent "$APP" ../Airora-mac.zip
          else npm run dist:win; cp dist/Airora-Setup.exe ../Airora-Setup.exe; fi
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.target }}", path: "Airora-*", if-no-files-found: error }
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: AbhiramUpadrashta/Airora-src, ssh-key: "${{ secrets.SRC_KEY }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        env: { AIRORA_VERSION: "${{ needs.check.outputs.version }}", AIRORA_VERSION_CODE: "${{ github.run_number }}" }
        run: |
          npm install --no-audit --no-fund
          ./build.sh && rm -rf dist/media && mkdir -p android/app/src/main/assets && cp -R dist android/app/src/main/assets/www
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Airora.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Airora.apk, if-no-files-found: error }
  release:
    needs: [check, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          V=${{ needs.check.outputs.version }}; TAG="v$V"; FILES="out/Airora.apk out/Airora-mac.zip out/Airora-Setup.exe"
          NOTES="Airora $V — world radio by Abhiram Upadrashta. Powered by Bubbles. MIT License.

          **Android:** download Airora.apk on your phone, open it and tap Install.
          **Windows:** download Airora-Setup.exe and run it (More info → Run anyway the first time).
          **Mac (Apple silicon):** download Airora-mac.zip, open it, drag Airora to Applications, then right-click → Open the first time.
          **iPhone & web:** https://abhiramupadrashta.github.io/Airora/app/"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" $FILES --clobber; else gh release create "$TAG" $FILES --title "Airora $V" --notes "$NOTES" --latest; fi
